<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="header">
      <div class="name">Match Pairs</div>

      <div class="counter">Счет<span id="score">0</span></div>
      <div class="counter">Попыток<span id="attempts">0</span></div>
    </div>
    <div class="main"></div>
    <div class="footer">
      <select id="difficulty">
        <option value="easy">Легкий 4x4</option>
        <option value="medium">Средний 6x6</option>
        <option value="hard">Сложный 8x8</option>
      </select>
      <button id="new-game">Новая игра</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
