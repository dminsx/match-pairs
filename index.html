<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Match Pairs</title>
  </head>
  <body>
    <div class="header">
      <div class="header-name">
        <div class="name">MATCH</div>
        <div class="name name--second">PAIRS</div>
      </div>
      <div class="counters">
        <div class="counter">Pairs<span id="score">0</span></div>
        <div class="counter">Attempts<span id="attempts">0</span></div>
        <div class="counter">
          Time
          <span id="time">
            <span id="m">0</span>:<span id="s">00</span>.<span id="ms">00</span>
          </span>
        </div>
      </div>
    </div>
    <div class="main"></div>
    <div class="footer">
      <select class="button" id="difficulty">
        <option value="4">Easy 4x4</option>
        <option value="6">Medium 6x6</option>
        <option value="8">Hard 8x8</option>
      </select>
      <button class="button" id="new-game">New Game</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
